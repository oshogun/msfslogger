<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>msfslogger</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>

<header class="header">
  <h1>msfs<span>logger</span></h1>
  <div class="header-right">
    <div class="status-badge" id="status-badge">
      <div class="dot disconnected" id="status-dot"></div>
      <span id="status-label">Checking...</span>
    </div>
  </div>
</header>

<div id="live-panel" class="live-panel" style="display:none">
  <div class="live-panel-inner container">
    <div class="live-title">
      <span class="dot flying"></span>
      <span id="live-aircraft">—</span>
    </div>
    <div class="live-grid">
      <div class="live-item">
        <div class="live-label">Airspeed</div>
        <div class="live-value"><span id="lv-airspeed">—</span><span class="live-unit">kts</span></div>
      </div>
      <div class="live-item">
        <div class="live-label">Ground Speed</div>
        <div class="live-value"><span id="lv-gs">—</span><span class="live-unit">kts</span></div>
      </div>
      <div class="live-item">
        <div class="live-label">Altitude</div>
        <div class="live-value"><span id="lv-alt">—</span><span class="live-unit">ft</span></div>
      </div>
      <div class="live-item">
        <div class="live-label">Heading</div>
        <div class="live-value"><span id="lv-hdg">—</span><span class="live-unit">°</span></div>
      </div>
      <div class="live-item">
        <div class="live-label">Vert Speed</div>
        <div class="live-value"><span id="lv-vs">—</span><span class="live-unit">fpm</span></div>
      </div>
      <div class="live-item">
        <div class="live-label">Position</div>
        <div class="live-value" style="font-size:1rem"><span id="lv-pos">—</span></div>
      </div>
    </div>
    <div id="live-map"></div>
  </div>
</div>

<main class="container">
  <div class="flights-header">
    <h2>Flight Log</h2>
  </div>

  <div id="combine-toolbar" class="combine-toolbar" style="display:none">
    <span id="combine-info"></span>
    <button id="btn-new-trip"    class="btn btn-ghost">New Trip</button>
    <button id="btn-add-to-trip" class="btn btn-ghost">Add to Trip</button>
    <button id="btn-combine"     class="btn btn-primary" disabled>Combine Selected</button>
  </div>

  <div id="empty-state" class="empty-state" style="display:none">
    <p style="font-size:2rem">✈</p>
    <p>No flights recorded yet.</p>
    <p>Start MSFS 2024 and take off to begin logging.</p>
  </div>

  <table id="flights-table">
    <thead>
      <tr>
        <th class="th-check"><input type="checkbox" id="select-all" title="Select all completed flights"></th>
        <th>Aircraft</th>
        <th>Date</th>
        <th>Duration</th>
        <th>Distance</th>
        <th>Max Alt</th>
        <th>Max Speed</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="flights-body">
      <tr><td colspan="8" style="padding:1rem;color:#4b5563">Loading...</td></tr>
    </tbody>
  </table>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
