<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trip — msfslogger</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>

<header class="header">
  <h1>msfs<span>logger</span></h1>
  <div class="header-right">
    <div class="status-badge" id="status-badge">
      <div class="dot disconnected" id="status-dot"></div>
      <span id="status-label">Checking...</span>
    </div>
  </div>
</header>

<main class="container" id="trip-detail">

  <a href="index.html" class="back-link">&#8592; All Flights</a>

  <h2 class="flight-title" id="trip-title">Loading...</h2>
  <p class="flight-subtitle" id="trip-subtitle"></p>

  <div class="stats-grid" id="stats-grid"></div>

  <div class="edit-section" id="edit-section" style="display:none">
    <div class="section-title">Edit Trip</div>
    <form id="edit-form" class="edit-form">
      <div class="edit-field">
        <label for="edit-name">Trip Name</label>
        <input type="text" id="edit-name" name="name" placeholder="Trip name" maxlength="200">
      </div>
      <div class="edit-field">
        <label for="edit-notes">Notes</label>
        <textarea id="edit-notes" name="notes" rows="4" placeholder="Free-form notes about this trip..."></textarea>
      </div>
      <div class="edit-actions">
        <button type="submit" class="btn btn-primary" id="btn-save">Save</button>
        <button type="button" class="btn btn-ghost" id="btn-cancel-edit">Cancel</button>
        <span class="edit-error" id="edit-error" style="display:none"></span>
      </div>
    </form>
  </div>

  <div class="map-section">
    <div class="section-title">Combined Route</div>
    <div id="map"></div>
  </div>

  <div class="legs-section">
    <div class="section-title">Legs</div>
    <table>
      <thead>
        <tr>
          <th>Leg</th>
          <th>Aircraft</th>
          <th>Date</th>
          <th>Duration</th>
          <th>Distance</th>
          <th>Route</th>
          <th></th>
          <th></th>
        </tr>
      </thead>
      <tbody id="legs-body">
        <tr><td colspan="7" style="padding:1rem;color:#4b5563">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="flight-actions">
    <a href="index.html" class="btn btn-ghost">&#8592; Back</a>
    <button id="btn-edit" class="btn btn-ghost">Edit</button>
    <button id="btn-delete" class="btn btn-danger">Delete Trip</button>
  </div>

</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
