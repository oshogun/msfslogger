name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      IBM_TELEMETRY_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: cd client && npm ci

      - name: Typecheck client
        run: cd client && npx tsc

      - name: Build client (with manifest)
        run: cd client && npx vite build --manifest

      - name: Build server
        run: npm run build:server

      - name: Print/export chunk guard
        run: cd client && npm run check:print-chunk

      - name: Typecheck tests
        run: npm run test:types

      - name: Run tests
        run: npm test

      - name: Typecheck client tests
        run: cd client && npm run test:types

      - name: Client component tests
        run: cd client && npm test

  docker:
    runs-on: ubuntu-latest
    # No `needs:` — this only exercises `docker build` against the Dockerfile,
    # which does its own `npm ci`/typecheck/build inside each stage and does
    # not consume anything build-and-test produces. Running it in parallel
    # gets the same coverage sooner instead of waiting behind an unrelated job.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    env:
      IBM_TELEMETRY_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: cd client && npm ci

      - name: Install Playwright browser
        run: cd client && npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: cd client && npm run test:e2e
        env:
          MSFSLOGGER_E2E_SCRATCH: ${{ runner.temp }}/msfslogger-e2e

      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7

      - name: Upload traces, screenshots and JUnit XML
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: client/test-results/
          retention-days: 7
