name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      IBM_TELEMETRY_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: cd client && npm ci

      - name: Build (client + server)
        run: npm run build

      - name: Print/export chunk guard
        run: |
          cd client
          npx vite build --manifest
          npm run check:print-chunk

      - name: Typecheck tests
        run: npm run test:types

      - name: Run tests
        run: npm test

      - name: Typecheck client tests
        run: cd client && npm run test:types

      - name: Client component tests
        run: cd client && npm test

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    env:
      IBM_TELEMETRY_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: cd client && npm ci

      - name: Install Playwright browser
        run: cd client && npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: cd client && npm run test:e2e
        env:
          MSFSLOGGER_E2E_SCRATCH: ${{ runner.temp }}/msfslogger-e2e

      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7

      - name: Upload traces, screenshots and JUnit XML
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: client/test-results/
          retention-days: 7
